<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Codex Mental · Laboratoire</title>
<meta name="description" content="Le laboratoire du Codex Mental : applications, logiciels, expériences CSS et idées de l'Atelier, dans un labo de savant fou en pixel art.">
<meta name="theme-color" content="#07080b">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/PressStart2P-Regular.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/VT323-Regular.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/lab.css">
<link rel="stylesheet" href="css/theme-alchimie.css">
<link rel="stylesheet" href="css/theme-hd.css">
<script>
  // Réglages du labo : thème, animations, saison d'Halloween.
  // ?theme=alchimie, ?anim=calm|off|full et ?halloween=1|0 forcent un réglage.
  window.LAB = (function () {
    var q = new URLSearchParams(location.search), d = new Date(), m = d.getMonth(), day = d.getDate();
    function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    var THEMES = {
      pixel: { label: 'Labo pixel', scene: 'js/scene.js' },
      alchimie: { label: 'Alchimie', scene: 'js/scene-alchimie.js' },
      hd: { label: 'Grand labo', scene: 'js/scene-hd.js' }
    };
    var theme = q.get('theme') || get('lab.theme') || 'pixel';
    if (!THEMES[theme]) theme = 'pixel';
    var motion = q.get('anim') || get('lab.motion');
    var explicit = !!motion;
    if (['full', 'calm', 'off'].indexOf(motion) < 0) {
      motion = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : 'full';
      explicit = false;
    }
    var f = q.get('halloween'), season = (m === 9 && day >= 20) || (m === 10 && day <= 2);
    var hw = f === null ? season : f === '1';
    var root = document.documentElement;
    root.dataset.theme = theme; root.dataset.motion = motion;
    if (hw) root.classList.add('halloween');
    return { halloween: hw, theme: theme, themes: THEMES, motion: motion, motionExplicit: explicit };
  })();
</script>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<div class="lab" id="lab">
  <header class="lab-head">
    <a class="brand" href="#/" aria-label="Accueil du laboratoire">
      <span class="brand-ico" aria-hidden="true"></span>
      <span class="brand-name">CODEX<b>MENTAL</b><i>.lab</i></span>
    </a>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Étagères du laboratoire"></nav>
    <div class="settings">
      <button class="set-btn" id="set-btn" type="button" aria-expanded="false" aria-controls="set-panel" title="Thème et animations"><span class="set-ico" aria-hidden="true"></span><span class="set-txt">Thème</span></button>
      <div class="set-panel" id="set-panel" hidden></div>
    </div>
  </header>
  <div class="lab-body">
    <main class="view" id="view" tabindex="-1" aria-live="polite">
      <p class="loading">Préchauffage des fioles…</p>
    </main>
    <div class="tube" id="tube" aria-hidden="true">
      <div class="tube-cork"></div>
      <div class="tube-glass" id="tube-glass">
        <div class="tube-thumb" id="tube-thumb"><i></i><i></i><i></i></div>
      </div>
    </div>
  </div>
  <div class="crt" aria-hidden="true"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>document.write('<script src="' + LAB.themes[LAB.theme].scene + '"><\/script>');</script>
<script src="js/app.js"></script>
</body>
</html>
