<script>
  // Réglages du labo : univers, salle, apparence, animations, saison d'Halloween.
  // Raccourcis d'adresse : ?theme=pro|pixel|alchimie|hd|nexus, ?scheme=dark|light, ?anim=full|calm|off, ?halloween=1|0
  window.LAB = (function () {
    var q = new URLSearchParams(location.search), d = new Date(), m = d.getMonth(), day = d.getDate();
    function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    // chaque salle appartient à un univers ; les portes font passer d'une salle à l'autre dans le même univers
    var THEMES = {
      pro: { label: 'Vitrine', universe: 'pro', scene: null },
      pixel: { label: 'Le labo', universe: 'pixel', scene: 'js/scene.js' },
      alchimie: { label: 'La paillasse', universe: 'pixel', scene: 'js/scene-alchimie.js' },
      hd: { label: 'Le grand labo', universe: 'vecto', scene: 'js/scene-hd.js' },
      observatoire: { label: 'L\'observatoire', universe: 'vecto', scene: 'js/scene-observatoire.js', kit: true, explore: true },
      station: { label: 'La station', universe: 'orbital', scene: 'js/scene-station.js', kit: true, explore: true },
      avantposte: { label: 'L\'avant-poste', universe: 'orbital', scene: 'js/scene-avantposte.js', kit: true },
      nexus: { label: 'NEXUS LAB', universe: 'nexus', scene: null }
    };
    var UNIVERSES = {
      pro: { label: 'Vitrine', desc: 'Sobre et lisible : l\'essentiel, sans décor.', rooms: ['pro'] },
      pixel: { label: 'Labo pixel', desc: 'Fioles, bobine Tesla et petit chimiste, façon vieux jeux.', rooms: ['pixel', 'alchimie'] },
      vecto: { label: 'Labo vectoriel', desc: 'Grand laboratoire d\'alchimie, puis l\'observatoire sous la coupole, à explorer librement.', rooms: ['hd', 'observatoire'] },
      orbital: { label: 'Univers orbital', desc: 'Un avant-poste sur une planète habitée, puis une station en apesanteur à explorer librement.', rooms: ['avantposte', 'station'] },
      nexus: { label: 'NEXUS', desc: 'Un écran des années 80 : console à taper, couleurs phosphore et effet cathodique réglable.', rooms: ['nexus'] }
    };
    var theme = q.get('theme') || get('lab.theme') || 'pro';
    if (!THEMES[theme]) theme = 'pro';
    var universe = THEMES[theme].universe;
    var scheme = q.get('scheme') || get('lab.scheme') || 'auto';
    if (['auto', 'dark', 'light'].indexOf(scheme) < 0) scheme = 'auto';
    var motion = q.get('anim') || get('lab.motion');
    var explicit = !!motion;
    if (['full', 'calm', 'off'].indexOf(motion) < 0) {
      motion = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : 'full';
      explicit = false;
    }
    var f = q.get('halloween'), season = (m === 9 && day >= 20) || (m === 10 && day <= 2);
    var hw = f === null ? season : f === '1';
    var root = document.documentElement, mq = matchMedia('(prefers-color-scheme: light)');
    function applyScheme() {
      var s = scheme === 'auto' ? (mq.matches ? 'light' : 'dark') : scheme;
      root.dataset.scheme = s;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = universe !== 'pro' ? '#07080b' : (s === 'light' ? '#f4f6fa' : '#0f1521');
    }
    root.dataset.lab = theme; root.dataset.universe = universe; root.dataset.motion = motion;
    applyScheme(); mq.addEventListener('change', applyScheme);
    if (hw) root.classList.add('halloween');
    // NEXUS : palette, police et intensité de l'écran, posées avant l'affichage pour éviter un flash
    if (universe === 'nexus') {
      var pal = get('nexus.palette'), font = get('nexus.font'), fx = get('nexus.fx');
      root.dataset.nxpal = /^(glacier|ambre|cuivre|lavande|bleu|menthe)$/.test(pal) ? pal : 'glacier';
      root.dataset.nxfont = /^(ecran|pixel|lisible)$/.test(font) ? font : 'ecran';
      fx = fx === null ? (motion === 'off' ? 0 : 55) : Math.max(0, Math.min(100, +fx || 0));
      root.style.setProperty('--nx-fx', (fx / 100).toFixed(2));
    }
    // salle libre : on y entre sans écran, pour explorer ; les projets restent à un bouton
    var explore = !!THEMES[theme].explore;
    if (explore) { root.classList.add('explore'); if (!/^#\/?[a-z]/.test(location.hash)) root.classList.add('panel-away'); }
    return { halloween: hw, theme: theme, themes: THEMES, universe: universe, universes: UNIVERSES, scheme: scheme, motion: motion, motionExplicit: explicit, explore: explore };
  })();
</script>
