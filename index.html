<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Codex Mental · Laboratoire</title>
<meta name="description" content="Le laboratoire du Codex Mental : applications, logiciels, expériences CSS et idées de l'Atelier. Une vitrine sobre, et des labos de savant fou à explorer.">
<meta name="theme-color" content="#07080b">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/lab.css">
<link rel="stylesheet" href="css/theme-alchimie.css">
<link rel="stylesheet" href="css/theme-hd.css">
<link rel="stylesheet" href="css/theme-pro.css">
<link rel="stylesheet" href="css/theme-orbital.css">
<script>
  // Réglages du labo : univers, salle, apparence, animations, saison d'Halloween.
  // Raccourcis d'adresse : ?theme=pro|pixel|alchimie|hd, ?scheme=dark|light, ?anim=full|calm|off, ?halloween=1|0
  window.LAB = (function () {
    var q = new URLSearchParams(location.search), d = new Date(), m = d.getMonth(), day = d.getDate();
    function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    // chaque salle appartient à un univers ; les portes font passer d'une salle à l'autre dans le même univers
    var THEMES = {
      pro: { label: 'Vitrine', universe: 'pro', scene: null },
      pixel: { label: 'Le labo', universe: 'pixel', scene: 'js/scene.js' },
      alchimie: { label: 'La paillasse', universe: 'pixel', scene: 'js/scene-alchimie.js' },
      hd: { label: 'Le grand labo', universe: 'vecto', scene: 'js/scene-hd.js' },
      observatoire: { label: 'L\'observatoire', universe: 'vecto', scene: 'js/scene-observatoire.js', kit: true },
      station: { label: 'La station', universe: 'orbital', scene: 'js/scene-station.js', kit: true },
      avantposte: { label: 'L\'avant-poste', universe: 'orbital', scene: 'js/scene-avantposte.js', kit: true }
    };
    var UNIVERSES = {
      pro: { label: 'Vitrine', desc: 'Sobre et lisible : l\'essentiel, sans décor.', rooms: ['pro'] },
      pixel: { label: 'Labo pixel', desc: 'Fioles, bobine Tesla et petit chimiste, façon vieux jeux.', rooms: ['pixel', 'alchimie'] },
      vecto: { label: 'Labo vectoriel', desc: 'Grand laboratoire d\'alchimie, puis l\'observatoire sous la coupole.', rooms: ['hd', 'observatoire'] },
      orbital: { label: 'Univers orbital', desc: 'Une station en apesanteur, puis un avant-poste sur une planète habitée.', rooms: ['station', 'avantposte'] }
    };
    var theme = q.get('theme') || get('lab.theme') || 'pro';
    if (!THEMES[theme]) theme = 'pro';
    var universe = THEMES[theme].universe;
    var scheme = q.get('scheme') || get('lab.scheme') || 'auto';
    if (['auto', 'dark', 'light'].indexOf(scheme) < 0) scheme = 'auto';
    var motion = q.get('anim') || get('lab.motion');
    var explicit = !!motion;
    if (['full', 'calm', 'off'].indexOf(motion) < 0) {
      motion = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'off' : 'full';
      explicit = false;
    }
    var f = q.get('halloween'), season = (m === 9 && day >= 20) || (m === 10 && day <= 2);
    var hw = f === null ? season : f === '1';
    var root = document.documentElement, mq = matchMedia('(prefers-color-scheme: light)');
    function applyScheme() {
      var s = scheme === 'auto' ? (mq.matches ? 'light' : 'dark') : scheme;
      root.dataset.scheme = s;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = universe !== 'pro' ? '#07080b' : (s === 'light' ? '#f4f6fa' : '#0f1521');
    }
    root.dataset.lab = theme; root.dataset.universe = universe; root.dataset.motion = motion;
    applyScheme(); mq.addEventListener('change', applyScheme);
    if (hw) root.classList.add('halloween');
    return { halloween: hw, theme: theme, themes: THEMES, universe: universe, universes: UNIVERSES, scheme: scheme, motion: motion, motionExplicit: explicit };
  })();
</script>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<div class="lab" id="lab">
  <header class="lab-head">
    <a class="brand" href="#/" aria-label="Accueil du laboratoire">
      <span class="brand-ico" aria-hidden="true"></span>
      <span class="brand-name">CODEX<b>MENTAL</b><i>.lab</i></span>
    </a>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Étagères du laboratoire"></nav>
    <div class="settings">
      <button class="set-btn" id="set-btn" type="button" aria-expanded="false" aria-controls="set-panel" title="Univers, apparence et animations"><span class="set-ico" aria-hidden="true"></span><span class="set-txt">Univers</span></button>
      <div class="set-panel" id="set-panel" hidden></div>
    </div>
  </header>
  <div class="lab-body">
    <main class="view" id="view" tabindex="-1" aria-live="polite">
      <p class="loading">Préchauffage des fioles…</p>
    </main>
    <div class="tube" id="tube" aria-hidden="true">
      <div class="tube-cork"></div>
      <div class="tube-glass" id="tube-glass">
        <div class="tube-thumb" id="tube-thumb"><i></i><i></i><i></i></div>
      </div>
    </div>
  </div>
  <div class="crt" aria-hidden="true"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>(function (th) { if (!th.scene) return; if (th.kit) document.write('<script src="js/vec-kit.js"><\/script>'); document.write('<script src="' + th.scene + '"><\/script>'); })(LAB.themes[LAB.theme]);</script>
<script src="js/app.js"></script>
</body>
</html>
